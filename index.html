<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>手机养宠</title>
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root {
      color-scheme: dark;
      --ink: #17202a;
      --muted: #6c7682;
      --soft: rgba(255, 255, 255, 0.72);
      --strong: rgba(255, 255, 255, 0.9);
      --line: rgba(28, 38, 48, 0.1);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: #f8fbff;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", system-ui, sans-serif;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      height: 100%;
      min-height: 100%;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .page {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
      color: #f8fbff;
    }

    .page.active {
      display: block;
    }

    .safe {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding:
        max(16px, env(safe-area-inset-top))
        14px
        max(14px, env(safe-area-inset-bottom));
    }

    .statusbar {
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0.78;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .pet-title h1,
    .settings-title h1,
    .picker-head h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .pet-title span {
      display: block;
      margin-top: 6px;
      color: rgba(248, 251, 255, 0.66);
      font-size: 12px;
      line-height: 1.35;
    }

    .tiny-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: inherit;
      display: grid;
      place-items: center;
      font-size: 15px;
      line-height: 1;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      text-decoration: none;
    }

    .stage {
      min-height: 0;
      display: grid;
      place-items: end center;
      position: relative;
    }

    .pet-sequence {
      width: min(82vw, 360px);
      max-height: 68vh;
      object-fit: contain;
      filter: drop-shadow(0 20px 24px rgba(0, 0, 0, 0.28));
      animation: breathe 4s ease-in-out infinite;
      user-select: none;
      -webkit-user-select: none;
    }

    .listen-area {
      display: grid;
      place-items: center;
      padding-bottom: 4px;
    }

    .siri-orb {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      background: #07101b;
      box-shadow:
        0 14px 34px rgba(25, 39, 56, 0.22),
        inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .siri-orb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
      display: block;
    }

    .settings-page {
      background:
        linear-gradient(180deg, #283645 0%, #485866 54%, #efe2d1 100%);
      color: #f8fbff;
    }

    .settings-main {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .pet-card {
      display: grid;
      grid-template-columns: 68px 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      background: var(--strong);
      color: var(--ink);
      border: 1px solid rgba(24, 32, 42, 0.08);
      box-shadow: 0 10px 26px rgba(30, 34, 39, 0.08);
    }

    .pet-card img {
      width: 62px;
      height: 62px;
      object-fit: contain;
    }

    .pet-card strong {
      display: block;
      font-size: 15px;
    }

    .setting-list {
      min-height: 0;
      overflow: hidden;
      display: grid;
      align-content: start;
      gap: 9px;
    }

    .setting-row {
      min-height: 58px;
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(24, 32, 42, 0.08);
      border-radius: 8px;
      background: rgba(255,255,255,0.78);
      color: var(--ink);
      text-decoration: none;
    }

    .setting-row.clickable {
      appearance: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .setting-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #edf2ec;
      color: #4f7d53;
      font-size: 16px;
    }

    .setting-row b {
      display: block;
      font-size: 14px;
      line-height: 1.2;
    }

    .setting-row span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .chevron {
      color: rgba(23, 32, 42, 0.42);
      font-size: 18px;
      font-weight: 700;
    }

    .switch {
      width: 42px;
      height: 24px;
      border-radius: 999px;
      padding: 3px;
      background: #dfe7dd;
      display: flex;
      justify-content: flex-end;
    }

    .switch i {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 3px 8px rgba(35, 42, 50, 0.16);
    }

    .picker-safe {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      gap: 12px;
      padding:
        max(16px, env(safe-area-inset-top))
        14px
        max(14px, env(safe-area-inset-bottom));
    }

    .picker-top {
      display: grid;
      gap: 12px;
    }

    .picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .picker-spacer {
      width: 30px;
      height: 30px;
    }

    .pet-carousel {
      min-height: 0;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 88%;
      gap: 14px;
      overflow-x: auto;
      padding: 10px 4px 16px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      align-items: stretch;
    }

    .pet-carousel::-webkit-scrollbar {
      display: none;
    }

    .pet-option {
      scroll-snap-align: start;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 12px;
      padding: 14px 12px 16px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: #000;
      color: #f8fbff;
    }

    .pet-photo {
      min-height: 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #000;
      overflow: hidden;
    }

    .pet-photo img {
      width: min(96%, 250px);
      height: min(100%, 360px);
      object-fit: contain;
      filter: drop-shadow(0 16px 22px rgba(255,255,255,0.06));
      animation: breathe 4s ease-in-out infinite;
    }

    .pet-option strong {
      display: block;
      font-size: 18px;
      line-height: 1.2;
      text-align: center;
    }

    .pet-option span {
      display: block;
      margin-top: 6px;
      color: rgba(248,251,255,0.62);
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    .picker-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding-bottom: 2px;
    }

    .picker-dots i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.28);
      transition: width 0.2s ease, background 0.2s ease;
    }

    .picker-dots i.active {
      width: 18px;
      background: rgba(255,255,255,0.78);
    }

    .select-btn {
      width: min(180px, 72%);
      justify-self: center;
      min-height: 42px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
      color: #111820;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.015); }
    }

    @media (min-width: 700px) {
      .app {
        width: min(390px, 100vw);
        height: min(844px, 100vh);
        margin: auto;
        border-radius: 28px;
        box-shadow: var(--shadow);
      }

      body {
        display: grid;
        place-items: center;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="手机养宠 Demo">
    <section class="page home-page active" data-page="home" aria-label="首页">
      <div class="safe">
        <div>
          <div class="statusbar">
            <span>9:41</span>
            <span class="signal"><i class="dot"></i><i class="dot"></i><i class="dot"></i> 84%</span>
          </div>
          <div class="top">
            <div class="pet-title">
              <h1 id="petNameTitle">小团子</h1>
              <span>它在听你说话</span>
            </div>
            <button class="tiny-btn" type="button" data-nav="settings" aria-label="打开设置">⚙</button>
          </div>
        </div>

        <section class="stage" aria-label="宠物主舞台">
          <img class="pet-sequence" id="homePetSequence" src="demo/turnaround_frames/frame_0001.png" alt="宠物动画" />
        </section>

        <div class="listen-area" aria-label="语音监听状态">
          <div class="siri-orb">
            <video src="siri.webm" autoplay muted loop playsinline></video>
          </div>
        </div>
      </div>
    </section>

    <section class="page settings-page" data-page="settings" aria-label="设置页">
      <div class="safe">
        <div>
          <div class="statusbar">
            <span>9:41</span>
            <span class="signal"><i class="dot"></i><i class="dot"></i><i class="dot"></i> 84%</span>
          </div>
          <div class="top">
            <button class="tiny-btn" type="button" data-nav="home" aria-label="返回首页">‹</button>
            <div class="settings-title">
              <h1>设置</h1>
            </div>
            <span class="tiny-btn" aria-hidden="true"></span>
          </div>
        </div>

        <section class="settings-main" aria-label="设置内容">
          <div class="pet-card">
            <img id="settingsPetThumb" src="demo/turnaround_frames/frame_0090.png" alt="当前宠物" />
            <div>
              <strong id="settingsPetName">小团子</strong>
            </div>
          </div>

          <div class="setting-list">
            <button class="setting-row clickable" type="button" data-nav="picker" aria-label="进入更换宠物页面">
              <div class="setting-icon">◌</div>
              <div><b>更换宠物</b><span>猫、狗、鸟、IP 形象包</span></div>
              <div class="chevron">›</div>
            </button>
            <div class="setting-row">
              <div class="setting-icon">♪</div>
              <div><b>声音反馈</b><span>叫声、呼吸、扑扇、玩具音</span></div>
              <div class="switch" aria-label="声音已开启"><i></i></div>
            </div>
            <div class="setting-row">
              <div class="setting-icon">⌁</div>
              <div><b>语音监听</b><span>只在前台打开时工作</span></div>
              <div class="switch" aria-label="语音监听已开启"><i></i></div>
            </div>
            <div class="setting-row">
              <div class="setting-icon">◎</div>
              <div><b>隐私与权限</b><span>麦克风、通知、数据说明</span></div>
              <div class="chevron">›</div>
            </div>
          </div>
        </section>
      </div>
    </section>

    <section class="page picker-page" data-page="picker" aria-label="更换宠物页">
      <div class="picker-safe">
        <div class="picker-top">
          <div class="statusbar">
            <span>9:41</span>
            <span class="signal"><i class="dot"></i><i class="dot"></i><i class="dot"></i> 84%</span>
          </div>
          <div class="picker-head">
            <button class="tiny-btn" type="button" data-nav="settings" aria-label="返回设置">‹</button>
            <h1>更换宠物</h1>
            <span class="picker-spacer" aria-hidden="true"></span>
          </div>
        </div>

        <div class="pet-carousel" id="petCarousel" aria-label="宠物轮播">
          <article class="pet-option" data-pet-name="小团子">
            <div class="pet-photo"><img class="picker-sequence" src="demo/turnaround_frames/frame_0001.png" alt="小团子" /></div>
            <div><strong>小团子</strong><span>安静黏人</span></div>
          </article>
          <article class="pet-option" data-pet-name="布丁">
            <div class="pet-photo"><img class="picker-sequence" src="demo/turnaround_frames/frame_0025.png" alt="布丁" /></div>
            <div><strong>布丁</strong><span>活泼好奇</span></div>
          </article>
          <article class="pet-option" data-pet-name="奶盖">
            <div class="pet-photo"><img class="picker-sequence" src="demo/turnaround_frames/frame_0050.png" alt="奶盖" /></div>
            <div><strong>奶盖</strong><span>爱撒娇</span></div>
          </article>
          <article class="pet-option" data-pet-name="豆豆">
            <div class="pet-photo"><img class="picker-sequence" src="demo/turnaround_frames/frame_0075.png" alt="豆豆" /></div>
            <div><strong>豆豆</strong><span>喜欢陪你发呆</span></div>
          </article>
        </div>

        <div class="picker-dots" id="pickerDots" aria-hidden="true">
          <i class="active"></i><i></i><i></i><i></i>
        </div>
        <button class="select-btn" id="selectPetBtn" type="button">选择它</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const pages = Array.from(document.querySelectorAll('.page'));
      const navButtons = Array.from(document.querySelectorAll('[data-nav]'));
      const homePet = document.getElementById('homePetSequence');
      const pickerPets = Array.from(document.querySelectorAll('.picker-sequence'));
      const carousel = document.getElementById('petCarousel');
      const petOptions = Array.from(document.querySelectorAll('.pet-option'));
      const dots = Array.from(document.querySelectorAll('#pickerDots i'));
      const selectPetBtn = document.getElementById('selectPetBtn');
      const petNameTitle = document.getElementById('petNameTitle');
      const settingsPetName = document.getElementById('settingsPetName');
      const settingsPetThumb = document.getElementById('settingsPetThumb');

      let frame = 1;
      let selectedIndex = 0;
      const totalFrames = 150;
      const frameMs = 1000 / 15;

      function frameUrl(index) {
        return 'demo/turnaround_frames/frame_' + String(index).padStart(4, '0') + '.png';
      }

      function showPage(name) {
        pages.forEach(function (page) {
          page.classList.toggle('active', page.dataset.page === name);
        });
      }

      function updatePickerIndex() {
        const optionWidth = petOptions[0] ? petOptions[0].getBoundingClientRect().width : 1;
        selectedIndex = Math.max(0, Math.min(petOptions.length - 1, Math.round(carousel.scrollLeft / optionWidth)));
        dots.forEach(function (dot, index) {
          dot.classList.toggle('active', index === selectedIndex);
        });
      }

      for (let i = 1; i <= totalFrames; i += 1) {
        const img = new Image();
        img.src = frameUrl(i);
      }

      setInterval(function () {
        frame = frame >= totalFrames ? 1 : frame + 1;
        homePet.src = frameUrl(frame);
        pickerPets.forEach(function (item, index) {
          const offsetFrame = ((frame + index * 24 - 1) % totalFrames) + 1;
          item.src = frameUrl(offsetFrame);
        });
      }, frameMs);

      navButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          showPage(button.dataset.nav);
        });
      });

      carousel.addEventListener('scroll', function () {
        window.requestAnimationFrame(updatePickerIndex);
      });

      selectPetBtn.addEventListener('click', function () {
        const selected = petOptions[selectedIndex];
        const name = selected ? selected.dataset.petName : '小团子';
        petNameTitle.textContent = name;
        settingsPetName.textContent = name;
        settingsPetThumb.src = frameUrl(((frame + selectedIndex * 24 - 1) % totalFrames) + 1);
        showPage('home');
      });
    })();
  </script>
</body>
</html>
