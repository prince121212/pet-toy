<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>宠物养成</title>
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root {
      --bg1: #000000;
      --bg2: #000000;
      --bg3: #000000;
      --panel: rgba(11, 20, 36, 0.56);
      --panel-strong: rgba(11, 20, 36, 0.72);
      --line: rgba(168, 214, 255, 0.14);
      --text: #e9f4ff;
      --muted: rgba(233, 244, 255, 0.68);
      --accent: #7ec7ff;
      --accent2: #c6f2ff;
      --shadow: 0 18px 55px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background: #000;
      overflow: hidden;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        max(14px, env(safe-area-inset-top))
        14px
        max(16px, env(safe-area-inset-bottom));
      gap: 12px;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .paw {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: linear-gradient(145deg, #1f3558, #0f192d);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
      flex: 0 0 auto;
    }

    .titles { min-width: 0; }
    .titles h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.1;
      letter-spacing: 0.02em;
    }
    .titles p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(190, 230, 255, 0.16);
      color: rgba(233,244,255,0.9);
      font-size: 12px;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .tool-btn {
      appearance: none;
      border: 0;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: rgba(233,244,255,0.92);
      display: grid;
      place-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      flex: 0 0 auto;
      cursor: pointer;
      text-decoration: none;
    }
    .tool-btn:active { transform: scale(0.96); }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      overflow: hidden;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 18px 8px 58px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,0.08), rgba(255,255,255,0.03) 36%, transparent 75%);
      filter: blur(2px);
      opacity: 0.95;
    }

    .card {
      position: relative;
      width: min(100%, 560px);
      height: min(100%, 100%);
      display: grid;
      place-items: center;
      padding: 12px;
    }

    .pet-shell {
      width: min(100%, 470px);
      aspect-ratio: 0.84 / 1;
      border-radius: 34px;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      position: relative;
    }

    .pet-shell::after {
      content: "";
      position: absolute;
      inset: auto 14% 6px;
      height: 18%;
      background: transparent;
      filter: none;
      transform: none;
    }

    .pet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 8px;
      color: rgba(233,244,255,0.85);
      position: relative;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }

    .pet-head .tag {
      font-size: 12px;
      letter-spacing: 0.18em;
      color: rgba(43, 84, 126, 0.72);
    }

    .pet-head .hint {
      font-size: 12px;
      color: rgba(43, 84, 126, 0.55);
    }

    .video-wrap {
      position: relative;
      display: grid;
      place-items: center;
      padding: 10px 8px 6px;
      z-index: 1;
    }

    .video-glow {
      position: absolute;
      width: min(84vw, 360px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: transparent;
      filter: none;
      animation: glow 4.8s ease-in-out infinite;
    }

    .pet-canvas {
      width: min(78vw, 320px);
      max-height: 58vh;
      filter: none;
      transform-origin: center;
      animation: bob 4.6s ease-in-out infinite;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* 触摸瞬时反馈 */
    .pet-canvas.spark {
      filter: brightness(1.35) drop-shadow(0 0 18px rgba(190,230,255,0.55));
      transition: filter 0.15s ease-out;
    }

    .footer {
      display: grid;
      place-items: center;
      padding-bottom: 2px;
    }

    .voice {
      width: 100%;
      display: grid;
      place-items: center;
      gap: 10px;
      color: var(--text);
    }

    .voice .copy {
      font-size: 13px;
      color: rgba(233,244,255,0.74);
    }

    .orb {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #060912;
      box-shadow: none;
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 0;
      animation: none;
    }

    .orb::after {
      inset: -28px;
      opacity: 0;
    }

    .orb canvas {
      width: 100%;
      height: 100%;
      filter: saturate(1.1) contrast(1.05);
      transform: scale(1.02);
    }

    .soft-bars {
      position: absolute;
      inset: auto 16px 88px;
      height: 10px;
      display: flex;
      justify-content: center;
      gap: 6px;
      opacity: 0.7;
      pointer-events: none;
    }

    .soft-bars span {
      width: 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(90,168,255,0.8), rgba(90,168,255,0.18));
      animation: bars 1.4s ease-in-out infinite;
    }
    .soft-bars span:nth-child(2) { animation-delay: 0.15s; }
    .soft-bars span:nth-child(3) { animation-delay: 0.3s; }
    .soft-bars span:nth-child(4) { animation-delay: 0.45s; }
    .soft-bars span:nth-child(5) { animation-delay: 0.6s; }

    @keyframes bob {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.01); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes bars {
      0%, 100% { height: 4px; opacity: 0.28; }
      50% { height: 10px; opacity: 1; }
    }

    @media (min-width: 768px) {
      .app {
        padding-left: 24px;
        padding-right: 24px;
      }
      .pet-shell {
        width: min(100%, 620px);
        aspect-ratio: 0.92 / 1;
      }
      .pet-canvas {
        width: min(56vw, 420px);
      }
      .soft-bars {
        inset: auto 24px 96px;
      }
    }
  </style>
</head>
<body>

  <!-- ====== 隐藏视频源（仅解码，不显示） ====== -->
  <video
    id="idleVideo"
    src="transparent-1778528599049.webm"
    muted playsinline preload="auto"
    disablePictureInPicture disableRemotePlayback
    style="display:none;"
  ></video>
  <video
    id="reactionVideo"
    src="pet-reaction.webm"
    muted playsinline preload="auto"
    disablePictureInPicture disableRemotePlayback
    style="display:none;"
  ></video>
  <video
    id="orbVideo"
    src="siri.webm"
    muted playsinline preload="auto"
    disablePictureInPicture disableRemotePlayback
    style="display:none;"
  ></video>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="paw">🐾</div>
        <div class="titles">
          <h1>我的小宠物</h1>
          <p>夜空里陪你玩</p>
        </div>
      </div>
      <div class="top-actions">
        <a class="tool-btn" href="demo/turnaround-sequence.html" aria-label="查看转圈圈帧序列">↻</a>
        <button class="tool-btn" id="fsBtn" type="button" aria-label="全屏">⤢</button>
      </div>
    </header>

    <section class="stage" aria-label="宠物展示区">
      <div class="card">
        <div class="pet-shell">
          <div class="video-wrap">
            <div class="video-glow" aria-hidden="true"></div>
            <canvas
              id="petCanvas"
              class="pet-canvas"
              aria-label="宠物动画"
            ></canvas>
          </div>

          <div class="soft-bars" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="voice">
        <div class="orb" aria-label="语音按钮">
          <canvas id="orbCanvas" aria-label="语音动画"></canvas>
        </div>
      </div>
    </footer>
  </main>

  <script>
    // ============================================================
    //  宠物动画引擎 — Canvas 渲染 + 触摸交互状态机
    // ============================================================
    (function () {
      /* ---- 隐藏视频源 ---- */
      const idleVideo = document.getElementById('idleVideo');
      const reactionVideo = document.getElementById('reactionVideo');
      const orbVideo = document.getElementById('orbVideo');

      /* ---- 画布 ---- */
      const petCanvas = document.getElementById('petCanvas');
      const orbCanvas = document.getElementById('orbCanvas');
      const petCtx = petCanvas.getContext('2d', { alpha: true });
      const orbCtx = orbCanvas.getContext('2d', { alpha: true });

      /* ---- 画布内部分辨率（与视频源一致） ---- */
      petCanvas.width = 720;
      petCanvas.height = 960;
      orbCanvas.width = 1280;
      orbCanvas.height = 960;

      /* ---- 状态 ---- */
      let currentVideo = idleVideo;
      let pendingReaction = false;
      let playingReaction = false;
      let reactionAvailable = false;
      let sparkTimer = null;

      /* ---- 渲染循环 ---- */
      function render() {
        if (currentVideo.readyState >= 2) {
          petCtx.clearRect(0, 0, petCanvas.width, petCanvas.height);
          petCtx.drawImage(currentVideo, 0, 0, petCanvas.width, petCanvas.height);
        }
        if (orbVideo.readyState >= 2) {
          orbCtx.clearRect(0, 0, orbCanvas.width, orbCanvas.height);
          orbCtx.drawImage(orbVideo, 0, 0, orbCanvas.width, orbCanvas.height);
        }
        requestAnimationFrame(render);
      }

      /* ---- 切换到指定视频 ---- */
      function switchTo(video, opts) {
        opts = opts || {};
        currentVideo = video;
        video.currentTime = 0;
        video.loop = !!opts.loop;
        return video.play();
      }

      /* ---- idle 播完一轮 ---- */
      idleVideo.addEventListener('ended', function () {
        if (pendingReaction && reactionAvailable) {
          pendingReaction = false;
          playingReaction = true;
          switchTo(reactionVideo, { loop: false });
        } else {
          idleVideo.currentTime = 0;
          idleVideo.play();
        }
      });

      /* ---- reaction 播完 ---- */
      reactionVideo.addEventListener('ended', function () {
        playingReaction = false;
        switchTo(idleVideo, { loop: false });
      });

      /* ---- 触摸瞬时反馈 ---- */
      function showSpark() {
        petCanvas.classList.add('spark');
        clearTimeout(sparkTimer);
        sparkTimer = setTimeout(function () {
          petCanvas.classList.remove('spark');
        }, 280);
      }

      /* ---- 用户交互：排队等待切 reaction ---- */
      function handleInteraction(e) {
        e.preventDefault();
        e.stopPropagation();

        if (playingReaction || pendingReaction) return;

        pendingReaction = true;
        showSpark();

        if (!reactionAvailable) {
          pendingReaction = false;
        }
      }

      petCanvas.addEventListener('click', handleInteraction);
      petCanvas.addEventListener('touchstart', handleInteraction, { passive: false });

      /* ---- 禁用 canvas 右键菜单 ---- */
      petCanvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      orbCanvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      /* ---- 启动 ---- */
      async function boot() {
        // 探测 reaction 视频是否可用
        try {
          await reactionVideo.play();
          reactionVideo.pause();
          reactionVideo.currentTime = 0;
          reactionAvailable = true;
        } catch (_) {
          reactionAvailable = false;
        }

        // 启动 idle + orb
        try {
          idleVideo.loop = false;
          await idleVideo.play();
          await orbVideo.play();
          orbVideo.loop = true;
          requestAnimationFrame(render);
        } catch (_) {
          // 自动播放被拦截，等首次触摸启动
          var startOnTouch = async function () {
            document.removeEventListener('touchstart', startOnTouch);
            document.removeEventListener('click', startOnTouch);
            await idleVideo.play();
            await orbVideo.play();
            orbVideo.loop = true;
            requestAnimationFrame(render);
          };
          document.addEventListener('touchstart', startOnTouch, { once: true });
          document.addEventListener('click', startOnTouch, { once: true });
        }
      }

      boot();
    })();

    /* ---- 全屏按钮 ---- */
    var fsBtn = document.getElementById('fsBtn');
    fsBtn && fsBtn.addEventListener('click', async function () {
      try {
        var el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          await el.requestFullscreen();
          fsBtn.textContent = '⤡';
        } else if (document.exitFullscreen) {
          await document.exitFullscreen();
          fsBtn.textContent = '⤢';
        }
      } catch (err) {
        fsBtn.textContent = '⤢';
      }
    });

    document.addEventListener('fullscreenchange', function () {
      fsBtn.textContent = document.fullscreenElement ? '⤡' : '⤢';
    });
  </script>
</body>
</html>
