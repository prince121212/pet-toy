<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>手机养宠 UI 设计稿</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #6c7682;
      --line: rgba(28, 38, 48, 0.1);
      --paper: #f3efe7;
      --soft: rgba(255, 255, 255, 0.72);
      --strong: rgba(255, 255, 255, 0.9);
      --green: #79a977;
      --blue: #7199ce;
      --rose: #cf8585;
      --shadow: 0 24px 70px rgba(39, 45, 52, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(113, 153, 206, 0.13), transparent 34%),
        linear-gradient(225deg, rgba(121, 169, 119, 0.14), transparent 36%),
        var(--paper);
    }

    .board {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 46px;
    }

    .board-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 24px;
    }

    .board-title h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .board-title p {
      width: min(610px, 100%);
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .board-link {
      flex: 0 0 auto;
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      box-shadow: 0 10px 28px rgba(39, 45, 52, 0.08);
    }

    .screen-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
    }

    .phone-wrap {
      display: grid;
      gap: 12px;
    }

    .phone-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .phone-label strong {
      color: var(--ink);
      font-size: 16px;
    }

    .phone {
      width: min(100%, 372px);
      margin: 0 auto;
      aspect-ratio: 390 / 844;
      padding: 12px;
      border-radius: 36px;
      background: #111820;
      box-shadow: var(--shadow);
    }

    .screen {
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background:
        linear-gradient(180deg, #eef4f1 0%, #f8f0e4 61%, #eee2d2 100%);
      border: 1px solid rgba(255,255,255,0.34);
    }

    .screen.home {
      background: #000;
      color: #f8fbff;
    }

    .screen.night {
      background:
        linear-gradient(180deg, #283645 0%, #485866 54%, #efe2d1 100%);
      color: #f8fbff;
    }

    .safe {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 16px 14px 14px;
      gap: 12px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .pet-title h2,
    .settings-title h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .pet-title span,
    .settings-title span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .home .pet-title span {
      color: rgba(248, 251, 255, 0.66);
    }

    .night .pet-title span {
      color: rgba(248, 251, 255, 0.68);
    }

    .tiny-btn {
      appearance: none;
      border: 1px solid rgba(24, 32, 42, 0.1);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--soft);
      color: inherit;
      display: grid;
      place-items: center;
      font-size: 15px;
      box-shadow: 0 8px 20px rgba(30, 34, 39, 0.08);
      cursor: pointer;
      text-decoration: none;
      line-height: 1;
    }

    .stage {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: end center;
      padding-bottom: 12px;
    }

    .home .stage {
      padding-bottom: 0;
    }

    .window {
      position: absolute;
      inset: 10px 8px 84px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.52), rgba(255,255,255,0.07)),
        linear-gradient(90deg, transparent 0 48%, rgba(255,255,255,0.24) 48% 49%, transparent 49% 100%);
      border: 1px solid rgba(255,255,255,0.38);
    }

    .home .window,
    .home .floor,
    .home .pet-note {
      display: none;
    }

    .floor {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 60px;
      height: 68px;
      border-radius: 50%;
      background: rgba(92, 80, 68, 0.14);
      filter: blur(2px);
    }

    .pet,
    .pet-sequence {
      position: relative;
      z-index: 2;
      width: min(82%, 268px);
      max-height: 68%;
      object-fit: contain;
      filter: drop-shadow(0 20px 24px rgba(0, 0, 0, 0.28));
      animation: breathe 4s ease-in-out infinite;
    }

    .pet-note {
      position: absolute;
      z-index: 3;
      left: 16px;
      bottom: 116px;
      max-width: 182px;
      padding: 10px 11px;
      border-radius: 8px;
      background: var(--strong);
      border: 1px solid rgba(24, 32, 42, 0.08);
      box-shadow: 0 12px 28px rgba(30, 34, 39, 0.12);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
    }

    .listen-area {
      position: relative;
      z-index: 5;
      display: grid;
      place-items: center;
      gap: 8px;
      padding-bottom: 4px;
    }

    .siri-orb {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      background: #07101b;
      box-shadow:
        0 14px 34px rgba(25, 39, 56, 0.22),
        inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .siri-orb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
      display: block;
    }

    .listen-text {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    .home .listen-area {
      gap: 0;
    }

    .home .listen-text {
      display: none;
    }

    .settings-main {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .pet-card {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      background: var(--strong);
      border: 1px solid rgba(24, 32, 42, 0.08);
      box-shadow: 0 10px 26px rgba(30, 34, 39, 0.08);
    }

    .pet-card img {
      width: 76px;
      height: 76px;
      object-fit: contain;
    }

    .pet-card strong {
      display: block;
      font-size: 15px;
    }

    .pet-card span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .pet-card.compact {
      grid-template-columns: 68px 1fr;
    }

    .pet-card.compact img {
      width: 62px;
      height: 62px;
    }

    .setting-list {
      min-height: 0;
      overflow: hidden;
      display: grid;
      align-content: start;
      gap: 9px;
    }

    .setting-row {
      min-height: 58px;
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(24, 32, 42, 0.08);
    }

    .setting-row.clickable {
      appearance: none;
      width: 100%;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .setting-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #edf2ec;
      color: #4f7d53;
      font-size: 16px;
    }

    .setting-row b {
      display: block;
      font-size: 14px;
      line-height: 1.2;
    }

    .setting-row span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .chevron {
      color: rgba(23, 32, 42, 0.42);
      font-weight: 700;
      font-size: 18px;
    }

    .switch {
      width: 42px;
      height: 24px;
      border-radius: 999px;
      padding: 3px;
      background: #dfe7dd;
      display: flex;
      justify-content: flex-end;
    }

    .switch i {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 3px 8px rgba(35, 42, 50, 0.16);
    }

    .pet-picker-safe {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 16px 14px 14px;
    }

    .picker-top {
      display: grid;
      gap: 12px;
    }

    .picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .picker-head h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.12;
    }

    .picker-spacer {
      width: 30px;
      height: 30px;
    }

    .pet-carousel {
      min-height: 0;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 88%;
      gap: 14px;
      overflow-x: auto;
      padding: 10px 4px 16px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      align-items: stretch;
    }

    .pet-carousel::-webkit-scrollbar {
      display: none;
    }

    .pet-option {
      scroll-snap-align: start;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 12px;
      padding: 14px 12px 16px;
      border-radius: 8px;
      background: #000;
      color: #f8fbff;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .pet-photo {
      min-height: 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #000;
      overflow: hidden;
    }

    .pet-photo img {
      width: min(96%, 250px);
      height: min(100%, 360px);
      object-fit: contain;
      filter: drop-shadow(0 16px 22px rgba(255,255,255,0.06));
      animation: breathe 4s ease-in-out infinite;
    }

    .pet-option strong {
      display: block;
      font-size: 18px;
      line-height: 1.2;
      text-align: center;
    }

    .pet-option span {
      display: block;
      margin-top: 6px;
      color: rgba(248,251,255,0.62);
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    .picker-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding-bottom: 2px;
    }

    .picker-dots i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.28);
    }

    .picker-dots i:first-child {
      width: 18px;
      background: rgba(255,255,255,0.78);
    }

    .select-btn {
      width: min(180px, 72%);
      justify-self: center;
      min-height: 42px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
      color: #111820;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.015); }
    }

    @media (max-width: 820px) {
      .board-head {
        align-items: start;
        flex-direction: column;
      }

      .screen-grid {
        grid-template-columns: 1fr;
      }

      .phone {
        width: min(100%, 390px);
      }
    }
  </style>
</head>
<body>
  <main class="board">
    <header class="board-head">
      <div class="board-title">
        <h1>手机养宠 UI 设计稿</h1>
        <p>首页负责陪伴和监听，设置页负责必要配置，更换宠物作为独立页面承接选择流程。用户看到的是宠物、声音入口和清晰的页面层级。</p>
      </div>
      <a class="board-link" href="../index.html">返回当前 Demo</a>
    </header>

    <section class="screen-grid" aria-label="核心页面设计">
      <article class="phone-wrap">
        <div class="phone-label"><strong>首页</strong><span>宠物 + 常驻监听</span></div>
        <div class="phone">
          <div class="screen home">
            <div class="safe">
              <div>
                <div class="top">
                  <div class="pet-title">
                    <h2>小团子</h2>
                    <span>它在听你说话</span>
                  </div>
                  <a class="tiny-btn" href="#settings" aria-label="打开设置">⚙</a>
                </div>
              </div>

              <section class="stage" aria-label="宠物主舞台">
                <div class="window" aria-hidden="true"></div>
                <div class="pet-note">轻轻说一句，它会用动作和声音回应你。</div>
                <div class="floor" aria-hidden="true"></div>
                <img class="pet-sequence" id="homePetSequence" src="../demo/turnaround_frames/frame_0001.png" alt="宠物动画" />
              </section>

              <div class="listen-area" aria-label="语音监听状态">
                <div class="siri-orb">
                  <video src="../siri.webm" autoplay muted loop playsinline></video>
                </div>
              </div>
            </div>
          </div>
        </div>
      </article>

      <article class="phone-wrap" id="settings">
        <div class="phone-label"><strong>设置页</strong><span>必要配置</span></div>
        <div class="phone">
          <div class="screen night">
            <div class="safe">
              <div>
                <div class="top">
                  <a class="tiny-btn" href="#" aria-label="返回首页">‹</a>
                  <div class="settings-title">
                    <h2>设置</h2>
                  </div>
                  <span class="tiny-btn" aria-hidden="true"> </span>
                </div>
              </div>

              <section class="settings-main" aria-label="设置内容">
                <div class="pet-card compact">
                  <img src="../demo/turnaround_frames/frame_0090.png" alt="当前宠物" />
                  <div>
                    <strong>小团子</strong>
                  </div>
                </div>

                <div class="setting-list">
                  <a class="setting-row clickable" href="#pet-picker" aria-label="进入更换宠物页面">
                    <div class="setting-icon">◌</div>
                    <div><b>更换宠物</b><span>猫、狗、鸟、IP 形象包</span></div>
                    <div class="chevron">›</div>
                  </a>
                  <div class="setting-row">
                    <div class="setting-icon">♪</div>
                    <div><b>声音反馈</b><span>叫声、呼吸、扑扇、玩具音</span></div>
                    <div class="switch" aria-label="声音已开启"><i></i></div>
                  </div>
                  <div class="setting-row">
                    <div class="setting-icon">⌁</div>
                    <div><b>语音监听</b><span>只在前台打开时工作</span></div>
                    <div class="switch" aria-label="语音监听已开启"><i></i></div>
                  </div>
                  <div class="setting-row">
                    <div class="setting-icon">◎</div>
                    <div><b>隐私与权限</b><span>麦克风、通知、数据说明</span></div>
                    <div class="chevron">›</div>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </article>

      <article class="phone-wrap" id="pet-picker">
        <div class="phone-label"><strong>更换宠物</strong><span>左右滑动选择</span></div>
        <div class="phone">
          <div class="screen home">
            <div class="pet-picker-safe">
              <div class="picker-top">
                <div class="picker-head">
                  <a class="tiny-btn" href="#settings" aria-label="返回设置">‹</a>
                  <h2>更换宠物</h2>
                  <span class="picker-spacer" aria-hidden="true"></span>
                </div>
              </div>

              <div class="pet-carousel" aria-label="宠物轮播">
                <div class="pet-option">
                  <div class="pet-photo"><img class="picker-sequence" src="../demo/turnaround_frames/frame_0001.png" alt="小团子" /></div>
                  <div><strong>小团子</strong><span>安静黏人</span></div>
                </div>
                <div class="pet-option">
                  <div class="pet-photo"><img class="picker-sequence" src="../demo/turnaround_frames/frame_0025.png" alt="布丁" /></div>
                  <div><strong>布丁</strong><span>活泼好奇</span></div>
                </div>
                <div class="pet-option">
                  <div class="pet-photo"><img class="picker-sequence" src="../demo/turnaround_frames/frame_0050.png" alt="奶盖" /></div>
                  <div><strong>奶盖</strong><span>爱撒娇</span></div>
                </div>
                <div class="pet-option">
                  <div class="pet-photo"><img class="picker-sequence" src="../demo/turnaround_frames/frame_0075.png" alt="豆豆" /></div>
                  <div><strong>豆豆</strong><span>喜欢陪你发呆</span></div>
                </div>
              </div>

              <div class="picker-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
              <button class="select-btn" type="button">选择它</button>
            </div>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script>
    (function () {
      const pet = document.getElementById('homePetSequence');
      let frame = 1;
      const totalFrames = 150;
      const frameMs = 1000 / 15;

      function frameUrl(index) {
        return '../demo/turnaround_frames/frame_' + String(index).padStart(4, '0') + '.png';
      }

      for (let i = 1; i <= totalFrames; i += 1) {
        const img = new Image();
        img.src = frameUrl(i);
      }

      setInterval(function () {
        frame = frame >= totalFrames ? 1 : frame + 1;
        pet.src = frameUrl(frame);
      }, frameMs);

      const pickerPets = Array.from(document.querySelectorAll('.picker-sequence'));
      setInterval(function () {
        pickerPets.forEach(function (item, index) {
          const offsetFrame = ((frame + index * 24 - 1) % totalFrames) + 1;
          item.src = frameUrl(offsetFrame);
        });
      }, frameMs);
    })();
  </script>
</body>
</html>
